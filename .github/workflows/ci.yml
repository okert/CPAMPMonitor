name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Run core checks
        run: swift run MonitorChecks

      - name: Check menu bar appearance
        run: |
          swiftc Sources/CPAMPMonitor/MenuBarAppearance.swift scripts/check-menu-bar.swift -o /tmp/check-menu-bar
          /tmp/check-menu-bar

      - name: Verify release compilation
        run: swift build -c release --product CPAMPMonitor

      - name: Verify Intel release compilation
        run: swift build -c release --arch x86_64 --product CPAMPMonitor
